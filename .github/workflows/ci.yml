name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - name: fmt
        run: deno fmt --check

      - name: lint
        run: deno lint

      - name: typecheck
        run: find app worker tests -type f \( -name "*.ts" -o -name "*.tsx" \) -print0 | xargs -0 deno check

      - name: unit tests
        run: deno task test

      - name: build
        run: deno task build
