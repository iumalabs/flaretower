name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, lint, typecheck, test, build
    # Fork-safe runs-on: this is a public repo with an unrestricted
    # `pull_request` trigger, so a fork PR's own code must never land on a
    # self-hosted runner (the runner user has passwordless sudo) — falls
    # back to ubuntu-latest specifically for fork-originated PRs, self-hosted
    # otherwise. See maksimyugai/github-runners's deploy/RUNBOOK.md, "Fork-
    # safe runs-on for public repos with an unrestricted pull_request
    # trigger".
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted", "general"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - name: fmt
        run: deno fmt --check

      - name: lint
        run: deno lint

      - name: typecheck
        run: |
          find app worker tests -type f \( -name "*.ts" -o -name "*.tsx" \) -print0 | xargs -0 deno check
          deno check vite.config.ts

      - name: unit tests
        run: deno task test

      - name: build
        run: deno task build
