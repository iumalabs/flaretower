name: release-automerge

on:
  schedule:
    # Roughly daily (spec.md FR-003/SC-003). A maintainer can also trigger
    # this manually at any time via workflow_dispatch (FR-004).
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No open release-please PR (nothing new since the last release) is
      # not an error — spec.md FR-002/Acceptance Scenario 2. Every step
      # after this one is skipped in that case, so the job succeeds as a
      # deliberate no-op.
      - name: Find open release-please PR
        id: find_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --label "autorelease: pending" --state open --json number --jq '.[0].number // empty')
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      # Merging is what release-please-action treats as "cut the release" —
      # it tags and publishes the GitHub Release + CHANGELOG.md entry as a
      # direct reaction to this PR closing merged (research.md §2). No
      # `--admin` bypass — if branch protection blocks the merge (e.g.
      # required checks still pending), this step fails and the whole job
      # fails visibly (FR-012) rather than forcing it through.
      - name: Merge release PR
        if: steps.find_pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "${{ steps.find_pr.outputs.pr_number }}" --squash

      # Fast-forwards `release` to the new main HEAD — the one thing that
      # actually triggers Cloudflare Workers Builds' production deploy,
      # once its production-branch setting is re-pointed at `release`
      # (research.md §1). A plain (non-force) push, so it only ever
      # succeeds as a genuine fast-forward; already-up-to-date is a no-op,
      # not an error (idempotent, per contracts/workflows.md).
      - name: Fast-forward release branch
        if: steps.find_pr.outputs.pr_number != ''
        run: |
          set -euo pipefail
          git fetch origin main
          git push origin origin/main:release
