name: release-publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  advance-release-branch:
    runs-on: ubuntu-latest
    # release-please always tags releases as "v<major>.<minor>.<patch>" —
    # skip anything else defensively (e.g. a release created by hand with a
    # different naming scheme should not silently move production).
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      # Checks out the exact tagged commit, not just whatever main's HEAD
      # happens to be at event-delivery time — fires identically whether
      # the release-please PR was merged by release-automerge.yml or by a
      # maintainer merging it by hand (FR-004), since both paths end in the
      # same `release: published` event.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Fast-forwards `release` to this exact commit — the one thing that
      # actually triggers Cloudflare Workers Builds' production deploy,
      # once its production-branch setting is re-pointed at `release`
      # (research.md §1). A plain (non-force) push, so it only ever
      # succeeds as a genuine fast-forward; already-up-to-date is a no-op,
      # not an error (idempotent, per contracts/workflows.md). A failure
      # here (e.g. `release` diverged) fails the job visibly (FR-012).
      - name: Fast-forward release branch
        run: |
          set -euo pipefail
          git push origin HEAD:release
