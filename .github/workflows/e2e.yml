name: E2E

# Unlike a schedule-only setup, this runs on every PR/push: the whole suite
# mocks every /api/* call via Playwright's own network layer (page.route())
# rather than exercising a real Cloudflare account or even real local D1, so
# there's no live-infra flake risk and no per-run cost beyond CI minutes —
# runs in well under a minute locally. Revisit if that stops being true.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno install

      - name: Install Playwright browsers
        run: deno task test:e2e:install

      - name: Run e2e suite
        run: deno task test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
